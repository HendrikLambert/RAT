# @package _global_
# Tiny RNN baseline for end-to-end smoke testing on M1 Pro.
defaults:
  - /data: pg19/gpt2_smoke
  - /model/backbone: sequence
  - /model/backbone/layer@model.backbone.seq_cell: rnn
  - /model/backbone/layer@model.backbone.hidden_cell: ffn
  - /model/head: lm
  - /model/embedding: lm
  - /model/embedding@model.embedding.pe: empty
  - /task: lm
  - /optim/lr_scheduler: cosine
  - /optim/optimizer: adamw
  - _self_

wandb_use: false

optim:
  optimizer:
    lr: 6.0e-4
    weight_decay: 0.1
    betas: [0.9, 0.98]
  lr_scheduler:
    warmup_iter: 0.1
    eta_min: 1.0e-6

wandb:
  job_type: pg19_smoke

model:
  backbone:
    num_layers: 2
    d_model: 128
    dropout: 0.0
    bias: false
    ln: rmsnorm
    init:
      _name_: fixed
      initializer_range: 0.02

task:
  ignore_index: -100

trainer:
  global_batch_size: ${data.global_batch_size}
  gradient_clipping: 1.0
  max_epoch: 1
  load_checkpoint: false
  save_checkpoint: false
  log_interval: 5
  eval_when_log: false
  dtype: float32
  device: cpu
  torch_compile: false
