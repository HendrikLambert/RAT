_name_: pg19_gpt2
seq_len: 8192
ignore_input_index: 50256  # GPT2 <|endoftext|>; loss is masked at document boundaries
num_bytes: 2
vocab_size: 50257
batch_size: 2
global_batch_size: 128  # batch_size × seq_len = 1.05M tokens, matches the paper's 1M-token budget at seq_len=8192. Override along with seq_len for 16K/32K runs.
train:
  _name_: lm_ordered
  tokenized_file_path: /home/hendrik/Studie/RSSLS/data/pg19/gpt2-train.bin
  batch_size: ${..batch_size}
  global_batch_size: ${..global_batch_size}
  seq_len: ${..seq_len}
  num_bytes: ${..num_bytes}
  vocab_size: ${..vocab_size}
  limit_tokens: -1
  ignore_input_index: ${..ignore_input_index}
val:
  _name_: lm_ordered
  tokenized_file_path: /home/hendrik/Studie/RSSLS/data/pg19/gpt2-val.bin
  batch_size: ${..batch_size}
  global_batch_size: ${..global_batch_size}
  seq_len: ${..seq_len}
  num_bytes: ${..num_bytes}
  vocab_size: ${..vocab_size}
  ignore_input_index: ${..ignore_input_index}
  limit_tokens: -1
